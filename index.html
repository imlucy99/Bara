<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speedometer HUD</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="hud">
    <svg id="speedometer" viewBox="0 0 320 245" aria-hidden="true">
      <defs>
        <filter id="needleGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="1.8" result="blur" />
          <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
      </defs>

      <path class="outer-arc" d="M 24 190 A 136 136 0 0 1 296 190" />
      <g id="ticks"></g>
      <g id="numbers"></g>

      <!-- Needle is drawn directly from the hub to its calculated endpoint. -->
      <line id="needle-shadow" class="needle-shadow" x1="160" y1="190" x2="160" y2="190" />
      <line id="needle" class="needle" x1="160" y1="190" x2="160" y2="190" />
      <circle class="needle-hub-outer" cx="160" cy="190" r="6" />
      <circle class="needle-hub" cx="160" cy="190" r="3.4" />

      <!-- Central gear / unit, retained as part of the existing vehicle HUD. -->
      <rect id="gear-box" x="146" y="153" width="28" height="22" rx="4" />
      <text id="gear" x="160" y="169" class="gear-main">1</text>
      <text x="160" y="184" class="speed-unit">MPH</text>

      <!-- Vehicle information / existing API indicators. -->
      <g id="vehicle-info">
        <g id="fuel-group" class="info-group">
          <text x="54" y="218" class="fuel-label">E</text>
          <g id="fuel-segments"></g>
          <text x="104" y="218" class="fuel-label">F</text>
          <path class="fuel-icon" d="M91 204v-9h-8v20h10c1.7 0 3-1.3 3-3v-6h-2v5c0 .6-.4 1-1 1h-2v-8z" />
          <rect class="fuel-icon" x="84" y="195" width="7" height="8" rx="1" />
        </g>

        <g id="indicators">
          <g id="indicator-left" class="icon-item" transform="translate(132 211)">
            <path d="M15 7H7.8l3.3-3.3L9.7 2.3 4 8l5.7 5.7 1.4-1.4L7.8 9H15z" />
          </g>
          <g id="indicator-right" class="icon-item" transform="translate(157 211)">
            <path d="M1 7h7.2L4.9 3.7l1.4-1.4L12 8l-5.7 5.7-1.4-1.4L8.2 9H1z" />
          </g>
          <g id="headlight-low" class="icon-item" transform="translate(181 211)">
            <path d="M8 2a6 6 0 0 1 0 12V2zM1 5l5 1M1 8h5M1 11l5-1" fill="none" stroke="currentColor" stroke-width="1.6" />
          </g>
          <g id="headlight-high" class="icon-item" transform="translate(203 211)">
            <path d="M8 2a6 6 0 0 1 0 12V2zM1 4h5M1 8h5M1 12h5" fill="none" stroke="currentColor" stroke-width="1.6" />
          </g>
          <g id="seatbelts" class="icon-item" transform="translate(226 211)">
            <path d="M4 2h2v5h4V2h2v5h3v2h-4v4h4v2H3v-2h4v-4H3V7h3V2z" />
          </g>
          <g id="door-lock" class="icon-item" transform="translate(250 211)">
            <path d="M12 7h-1V5a4 4 0 0 0-8 0v2H2v8h10V7zM5 7V5a2 2 0 1 1 4 0v2H5zm2 5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" />
          </g>
        </g>
      </g>

      <text id="odometer" x="160" y="236" class="odometer">0.0 mi</text>
    </svg>

    <!-- Hidden compatibility nodes retained for existing integrations. -->
    <div class="compat">
      <span id="speed-display"></span>
      <span id="speed-mode">MPH</span>
      <span id="health-segments"></span>
      <span id="rpm"></span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
