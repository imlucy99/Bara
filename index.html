<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analog Speedometer HUD</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="hud">
    <svg id="cluster" viewBox="0 0 520 390" aria-label="Analog speedometer">
      <defs>
        <filter id="needleGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="1.8" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="1.2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <path class="outer-arc" d="M 74 302 A 186 186 0 0 1 446 302"/>
      <path class="inner-arc" d="M 81 299 A 179 179 0 0 1 439 299"/>
      <g id="ticks"></g>
      <g id="numbers"></g>

      <g id="needle">
        <path id="needle-shadow" class="needle-shadow" d="M260 302 L260 302 L260 302 Z"/>
        <path id="needle-path" class="needle" d="M260 302 L260 302 L260 302 Z"/>
        <circle class="hub-ring" cx="260" cy="302" r="7"/>
        <circle class="hub" cx="260" cy="302" r="3.5"/>
      </g>

      <!-- Center digital speed -->
      <g class="digital-box">
        <text id="speed-digital" x="260" y="268">0</text>
        <text x="260" y="282" class="unit">MPH</text>
      </g>

      <!-- Gear -->
      <g class="info">
        <rect x="245" y="288" width="30" height="24" rx="3" class="gear-box"/>
        <text id="gear" x="260" y="306" class="gear">1</text>
        <text id="odometer" x="260" y="352" class="odo">ODO&nbsp;&nbsp;000123.4</text>
      </g>

      <!-- Engine health -->
      <g class="engine-cluster">
        <!-- Check-engine / MIL icon -->
        <g class="check-engine-icon" transform="translate(392 314)">
          <path d="M4 8h4l3-4h8l3 4h4v11h-4l-2 3H9l-2-3H4z"/>
          <path d="M10 11h9v6h-9z" class="engine-cut"/>
          <path d="M19 9v-4h4v4M8 19H4v-3M25 19h4v-3" />
        </g>
        <g id="health-segments" class="health-segments"></g>
        <text id="health-value" x="405" y="344" class="compact-value">100%</text>
      </g>

      <!-- Fuel -->
      <g class="fuel-cluster">
        <g class="fuel-icon" transform="translate(126 315)">
          <path d="M0 3h10v17H0z"/>
          <path d="M2 5h6v5H2z" class="icon-cut"/>
          <path d="M10 6h4c2 0 3 2 3 4v6"/>
          <path d="M17 16h3v5"/>
        </g>
        <text x="116" y="323" class="fuel-letter">E</text>
        <text x="156" y="323" class="fuel-letter">F</text>
        <g id="fuel-segments" class="fuel-segments"></g>
        <text id="fuel-value" x="136" y="344" class="compact-value">100%</text>
      </g>

      <!-- Seatbelt -->
      <g id="seatbelts" class="icon-item warn" transform="translate(82 313)">
        <circle cx="9" cy="4" r="3"/>
        <path d="M4 11c1-4 9-4 10 0l3 12H14l-2-8H9l-2 8H3z"/>
        <path d="M3 8l14 14" class="seatbelt-line"/>
      </g>

      <!-- Headlight / vehicle status -->
      <g id="headlight-high" class="icon-item" transform="translate(320 313)">
        <path d="M2 5a9 9 0 0 1 0 18V5z"/>
        <path d="M-9 7h8M-9 14h8M-9 21h8"/>
      </g>
      <g id="headlight-low" class="icon-item" transform="translate(348 313)">
        <path d="M2 5a9 9 0 0 1 0 18V5z"/>
        <path d="M-7 7l6 2M-7 14l6 1M-7 21l6-1"/>
      </g>

      <!-- API compatibility: hidden, because turn signals are intentionally not shown -->
      <g id="door-lock" style="display:none"></g>
      <g id="indicator-left" style="display:none"></g>
      <g id="indicator-right" style="display:none"></g>
      <g id="rpm" class="rpm-strip" style="display:none"></g>
    </svg>
  </div>
  <script src="script.js"></script>
</body>
</html>
