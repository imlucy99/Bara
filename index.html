<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analog Speedometer HUD</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="hud">
    <svg id="cluster" viewBox="0 0 520 390" aria-label="Analog speedometer">
      <defs>
        <filter id="needleGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="2.2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="1.5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <path class="outer-arc" d="M 43 310 A 217 217 0 0 1 477 310"/>
      <path class="inner-arc" d="M 50 307 A 210 210 0 0 1 470 307"/>
      <g id="ticks"></g>
      <g id="numbers"></g>

      <g id="needle" transform="rotate(-110 260 310)">
        <path class="needle-shadow" d="M257 313 L258 307 L421 267 L425 273 Z"/>
        <path class="needle" d="M258 313 L259 307 L421 267 L425 273 Z"/>
        <circle class="hub-ring" cx="260" cy="310" r="9"/>
        <circle class="hub" cx="260" cy="310" r="5"/>
      </g>

      <g class="digital-box">
        <text id="speed-digital" x="260" y="345">0</text>
        <text x="260" y="362" class="unit">MPH</text>
      </g>

      <!-- Fuel -->
      <g class="side-gauge fuel-gauge">
        <text x="90" y="277" class="side-title">FUEL</text>
        <text x="90" y="291" class="side-value" id="fuel-value">100%</text>
        <rect x="74" y="300" width="34" height="6" rx="2" class="bar-bg"/>
        <rect id="fuel-bar" x="74" y="300" width="34" height="6" rx="2" class="fuel-bar"/>
        <text x="70" y="317" class="side-small">E</text>
        <text x="110" y="317" class="side-small">F</text>
      </g>

      <!-- Engine health -->
      <g class="side-gauge health-gauge">
        <text x="430" y="277" class="side-title">ENGINE</text>
        <text x="430" y="291" class="side-value" id="health-value">100%</text>
        <rect x="412" y="300" width="34" height="6" rx="2" class="bar-bg"/>
        <rect id="health-bar" x="412" y="300" width="34" height="6" rx="2" class="health-bar"/>
        <text x="408" y="317" class="side-small">0</text>
        <text x="448" y="317" class="side-small">OK</text>
      </g>

      <!-- Gear / odometer -->
      <g class="info">
        <rect x="232" y="274" width="56" height="36" rx="5" class="gear-box"/>
        <text id="gear" x="260" y="299" class="gear">1</text>
        <text id="odometer" x="260" y="382" class="odo">0.0 mi</text>
      </g>

      <!-- warning / vehicle icons -->
      <g id="indicator-left" class="icon-item" transform="translate(153 352)">
        <path d="M25 10H9l6-6-3-3-12 12 12 12 3-3-6-6h16z"/>
      </g>
      <g id="indicator-right" class="icon-item" transform="translate(342 352)">
        <path d="M-1 10h16l-6-6 3-3 12 12-12 12-3-3 6-6H-1z"/>
      </g>
      <g id="headlight-low" class="icon-item" transform="translate(185 352)">
        <path d="M2 6a9 9 0 0 1 0 18V6z"/>
        <path d="M-8 8l7 2M-8 15l7 1M-8 22l7-1"/>
      </g>
      <g id="headlight-high" class="icon-item" transform="translate(298 352)">
        <path d="M2 6a9 9 0 0 1 0 18V6z"/>
        <path d="M-9 8h8M-9 15h8M-9 22h8"/>
      </g>
      <g id="seatbelts" class="icon-item" transform="translate(215 352)">
        <path d="M2 1v5h12V1h4v7a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V1zM4 13h12v9H4z"/>
        <path d="M7 13h3v9H7z"/>
      </g>
      <g id="door-lock" class="icon-item" transform="translate(270 352)">
        <path d="M4 10V7a8 8 0 0 1 16 0v3h2v13H2V10zm4 0h8V7a4 4 0 0 0-8 0z"/>
        <circle cx="12" cy="16" r="2" class="icon-cut"/>
      </g>

      <!-- RPM strip -->
      <g id="rpm" class="rpm-strip"></g>
    </svg>
  </div>
  <script src="script.js"></script>
</body>
</html>
